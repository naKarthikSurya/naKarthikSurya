name: Metrics
on:
  # Schedule updates (every 12 hours)
  schedule:
    - cron: "0 */12 * * *"
  # Allows running workflow manually from the Actions tab and on pushes to main
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Target output
          filename: github-metrics.svg
          committer_branch: metrics
          committer_message: "chore: update metrics [skip ci]"

          # Options & Templates
          template: classic
          base: header, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Calcutta

          # Languages Breakdown (Rock solid)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          # Coding Habits & Active Hours (Reliable & informative)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # Notable Contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_self: yes
          plugin_notable_types: commit
